name: Lint

"on":
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Pinned exactly (unlike the project's own "ruff>=0.17" dev extra) so a
      # new ruff release enabling a stricter default can't fail this job on
      # an otherwise-unrelated push.
      - run: pip install ruff==0.17.1

      - name: ruff check
        run: ruff check src/ tests/ examples/ runtime-downloads/

      - name: ruff format --check
        run: ruff format --check src/ tests/ examples/ runtime-downloads/
