[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oaax"
dynamic = ["version"]
authors = [
  { name="Josef Joubert", email="jjoubert@networkoptix.com" },
]
description = "Python bindings for OAAX runtime libraries (interface.h, OAAX 2.0)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/OAAX-standard/PythonBindings"
Issues = "https://github.com/OAAX-standard/PythonBindings/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
# Lets oaax.onnx_introspect read a model's input/output specs straight from
# an .onnx file when a runtime doesn't report them via runtime_get_info().
onnx = ["onnx>=1.14"]
# Extra dependencies used by the sample scripts under examples/: Pillow for the
# vision examples' image I/O, tokenizers for the text examples' tokenizer.json files.
examples = ["pillow>=10", "tokenizers>=0.15"]
lint = ["ruff>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oaax = ["py.typed"]

[tool.setuptools.dynamic]
# VERSION at the repo root is the single source of truth; oaax.__version__
# reads it back out via importlib.metadata at import time (see src/oaax/__init__.py).
version = { file = "VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
